name: winget-publish

on:
  workflow_dispatch:
    inputs:
      release-tag:
        type: string
        description: Rainmeter release tag
        required: true

permissions:
  contents: read

concurrency:
  group: winget-publish-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Get release information
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+)\.\d+$') {
            throw "Invalid release tag: $env:RELEASE_TAG. Expected vX.X.X.X."
          }

          $version = $Matches[1]
          $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $urls = @(($release | ConvertFrom-Json).assets | Where-Object { $_.name -match '\.exe$' } | ForEach-Object { $_.url })
          if ($urls.Count -eq 0) {
            throw "No .exe installers found in release $env:RELEASE_TAG"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "urls=$(ConvertTo-Json -InputObject $urls -Compress)" >> $env:GITHUB_OUTPUT

      - name: Install Komac
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/russellbanks/Komac/releases/download/v2.16.0/komac-2.16.0-x86_64-pc-windows-msvc.exe' -OutFile "$env:RUNNER_TEMP/komac.exe"
          $hash = (Get-FileHash -Path "$env:RUNNER_TEMP/komac.exe" -Algorithm SHA256).Hash
          if ($hash -ne 'bdc45baf028f750da7519cc8a5f2eab5dfef46dfe88650eeb0d0a9bf51446e4f') {
            throw 'Komac SHA-256 checksum mismatch.'
          }

      - name: Submit WinGet pull request
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_FORK_OWNER: rainmeter
          PACKAGE_VERSION: ${{ steps.release.outputs.version }}
          INSTALLER_URLS: ${{ steps.release.outputs.urls }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_TOKEN)) {
            throw 'The WINGET_TOKEN secret is missing.'
          }

          $urls = @($env:INSTALLER_URLS | ConvertFrom-Json)
          & "$env:RUNNER_TEMP/komac.exe" update Rainmeter.Rainmeter --version $env:PACKAGE_VERSION --urls $urls --release-notes-url https://docs.rainmeter.net/history/ --submit
          exit $LASTEXITCODE
