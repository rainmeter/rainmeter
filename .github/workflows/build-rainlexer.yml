name: build-rainlexer

on:
  push:
    branches:
      - '**'
    paths:
      - 'RainLexer/**'
      - '.github/workflows/*rainlexer*'

env:
  BUILD_VERSION: "${{ github.run_number }}"

jobs:
  rainlexer:
    if: "!contains(github.event.head_commit.message, 'skipci') && !contains(github.event.head_commit.message, 'ciskip')"
    runs-on: windows-2025-vs2026
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Test RainLexer
        run: .\RainLexer\Build\Build.ps1 test "$(Get-Date -Format 'yyyy.M').$env:BUILD_VERSION"
        shell: pwsh

      - name: Build RainLexer
        run: .\RainLexer\Build\Build.ps1 rainlexer "$(Get-Date -Format 'yyyy.M').$env:BUILD_VERSION"
        shell: pwsh

      - name: Upload RainLexer build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RainLexerBuild
          path: |
            RainLexer/x64-Release
            !RainLexer/x64-Release/Obj
          if-no-files-found: error

  installer:
    needs: rainlexer
    runs-on: windows-2025-vs2026
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download RainLexer build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: RainLexerBuild
          path: RainLexer

      - name: Install NSIS
        uses: ./.github/actions/install-nsis

      - name: Build installer
        run: .\RainLexer\Build\Build.ps1 installer "$(Get-Date -Format 'yyyy.M').$env:BUILD_VERSION"
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-installer
        with:
          path: RainLexer/Build/RainLexer-*.exe
          archive: false
          if-no-files-found: error
