name: build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'RainLexer/**'
      - '.github/workflows/*rainlexer*'

jobs:
  rainmeter:
    if: "!contains(github.event.head_commit.message, 'skipci') && !contains(github.event.head_commit.message, 'ciskip')"
    runs-on: windows-2025-vs2026
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install NSIS
        id: install-nsis
        uses: ./.github/actions/install-nsis
        background: true

      - name: Validate and generate language files
        id: generate-languages
        run: |
          ./Language/UpdateLanguageFiles.sh
          if ! git diff --quiet -- Language; then
            echo "::error::Language files are out of sync. Run Language/UpdateLanguageFiles.sh and commit the result."
            git diff -- Language
            exit 1
          fi
          pwsh -File ./Build/Build.ps1 languages
        shell: bash
        background: true

      - name: Cache 64-bit build
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: BuildOut/Release64/Obj
          key: rainmeter-msbuild-v3-release-64-${{ github.sha }}
          restore-keys: |
            rainmeter-msbuild-v3-release-64-

      - name: Prepare 64-bit build cache
        run: .\Build\PrepareBuildCache.ps1 "BuildOut\Release64\Obj"
        shell: pwsh

      - name: Build 64-bit Rainmeter
        run: .\Build\Build.ps1 rainmeter-64 "$(Get-Date -Format 'yyyy.M.d').$env:GITHUB_RUN_NUMBER" include-tests -MSBuildTarget build
        shell: pwsh

      - name: Save 64-bit build cache
        id: save-build-cache
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: BuildOut/Release64/Obj
          key: rainmeter-msbuild-v3-release-64-${{ github.sha }}
        background: true

      - name: Test 64-bit Rainmeter
        run: .\Build\Build.ps1 test-64
        shell: pwsh

      - name: Wait for language generation
        wait: generate-languages

      - name: Upload 64-bit build
        id: upload-build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: BuildOut-Release64
          path: |
            BuildOut/Release64
            !BuildOut/Release64/Obj
          if-no-files-found: error
        background: true

      - name: Upload 64-bit debug symbols
        id: upload-debug-symbols
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DebugSymbols-Release64
          path: BuildOut/**/*.pdb
          if-no-files-found: error
        background: true

      - name: Wait for NSIS installation
        wait: install-nsis

      - name: Build installer
        run: .\Build\Build.ps1 installer "$(Get-Date -Format 'yyyy.M.d').$env:GITHUB_RUN_NUMBER" -X64Only -SkipLanguages
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: Build/Rainmeter-*.exe
          archive: false
          if-no-files-found: error

      - name: Wait for build uploads
        wait: [upload-build, upload-debug-symbols, save-build-cache]
