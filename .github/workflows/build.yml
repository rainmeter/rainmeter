name: build

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - 'RainLexer/**'
      - '.github/workflows/*rainlexer*'

jobs:
  rainmeter:
    if: "!contains(github.event.head_commit.message, 'skipci') && !contains(github.event.head_commit.message, 'ciskip')"
    strategy:
      matrix:
        arch: [32, 64]
    runs-on: windows-2025-vs2026
    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Validate language files
        if: ${{ matrix.arch == 64 }}
        run: |
          ./Language/UpdateLanguageFiles.sh
          if ! git diff --quiet -- Language; then
            echo "::error::Language files are out of sync. Run Language/UpdateLanguageFiles.sh and commit the result."
            git diff -- Language
            exit 1
          fi
        shell: bash

      - name: Build ${{ matrix.arch }}-bit Rainmeter
        run: |
          $buildVersion = "$(Get-Date -Format 'yyyy.M.d').$env:GITHUB_RUN_NUMBER"
          .\Build\Build.ps1 rainmeter-${{ matrix.arch }} $buildVersion include-tests -MSBuildTarget build
        shell: pwsh

      - name: Test 64-bit Rainmeter
        if: ${{ matrix.arch == 64 }}
        run: .\Build\Build.ps1 test-64
        shell: pwsh

      - name: Upload ${{ matrix.arch }}-bit build
        uses: actions/upload-artifact@v7
        with:
          name: BuildOut-Release${{ matrix.arch }}
          path: |
            BuildOut/Release${{ matrix.arch }}
            !BuildOut/Release${{ matrix.arch }}/Obj
          if-no-files-found: error

      - name: Upload 64-bit debug symbols
        if: ${{ matrix.arch == 64 }}
        uses: actions/upload-artifact@v7
        with:
          name: DebugSymbols-Release${{ matrix.arch }}
          path: BuildOut/**/*.pdb
          if-no-files-found: error

      - name: Build plugin API
        if: ${{ matrix.arch == 64 }}
        run: .\Build\Build.ps1 plugin-api
        shell: pwsh

      - name: Upload plugin API
        if: ${{ matrix.arch == 64 }}
        uses: actions/upload-artifact@v7
        with:
          name: PluginAPI
          path: BuildOut/PluginAPI
          if-no-files-found: error

  installer:
    needs: rainmeter
    runs-on: windows-2025-vs2026
    steps:
      - name: Clone repo
        uses: actions/checkout@v5

      - name: Download 32-bit build
        uses: actions/download-artifact@v8
        with:
          name: BuildOut-Release32
          path: BuildOut/Release32

      - name: Download 64-bit build
        uses: actions/download-artifact@v8
        with:
          name: BuildOut-Release64
          path: BuildOut/Release64

      - name: Install NSIS
        uses: ./.github/actions/install-nsis

      - name: Build installer
        run: |
          $buildVersion = "$(Get-Date -Format 'yyyy.M.d').$env:GITHUB_RUN_NUMBER"
          .\Build\Build.ps1 installer $buildVersion
        shell: pwsh

      - name: Upload installer
        uses: actions/upload-artifact@v7
        id: upload-installer
        with:
          path: Build/Rainmeter-*.exe
          archive: false
          if-no-files-found: error
