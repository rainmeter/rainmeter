name: build

on:
  push:
    branches:
      - '**'

jobs:
  rainmeter:
    strategy:
      matrix:
        arch: [32, 64]

    runs-on: windows-2022
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build ${{ matrix.arch }}-bit Rainmeter
        run: cd Build && Build.bat rainmeter-${{ matrix.arch }} %date:~-4%.%date:~4,2%.%date:~7,2%.%GITHUB_RUN_NUMBER%
        shell: cmd

      - name: Upload ${{ matrix.arch }}-bit build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: x${{ matrix.arch }}-Release
          path: |
            x${{ matrix.arch }}-Release
            !x${{ matrix.arch }}-Release/Obj
          if-no-files-found: error

  installer:
    needs: rainmeter
    runs-on: windows-2022
    steps:
      - name: Clone repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Download 32-bit & 64-bit builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: x*-Release

      - name: Install NSIS
        run: choco install nsis --version=3.12.0 --no-progress

      - name: Build installer
        run: cd Build && Build.bat installer %date:~-4%.%date:~4,2%.%date:~7,2%.%GITHUB_RUN_NUMBER%
        shell: cmd

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload-installer
        with:
          path: Build/Rainmeter-*.exe
          archive: false
          if-no-files-found: error
