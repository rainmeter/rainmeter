name: Install NSIS
description: Download and extract the NSIS workflow artifact

runs:
  using: composite
  steps:
    - name: Download NSIS
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        repository: poiru/nsis
        run-id: '39225338263'
        artifact-ids: '12173737379'
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/nsis-artifact

    - name: Install NSIS
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'

        $artifactDir = Join-Path $env:RUNNER_TEMP 'nsis-artifact'
        $archives = @(Get-ChildItem -LiteralPath $artifactDir -Filter 'nsis-*.zip' -File)
        if ($archives.Count -ne 1) {
          throw 'Expected exactly one NSIS ZIP in the workflow artifact.'
        }

        $extractDir = Join-Path $env:RUNNER_TEMP 'nsis-extracted'
        Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractDir -Force
        $sourceDirs = @(Get-ChildItem -LiteralPath $extractDir -Directory |
          Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'makensis.exe') -PathType Leaf })
        if ($sourceDirs.Count -ne 1) {
          throw 'Expected exactly one NSIS directory containing makensis.exe.'
        }

        $nsisDir = Join-Path $env:ProgramFiles 'NSIS'
        New-Item -ItemType Directory -Path $nsisDir -Force | Out-Null
        Copy-Item -Path (Join-Path $sourceDirs[0].FullName '*') -Destination $nsisDir -Recurse -Force
        Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
